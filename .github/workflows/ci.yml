name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ format('{0}', 'postgres') }}
          POSTGRES_DB: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dev
      PGUSER: postgres
      PGPASSWORD: ${{ format('{0}', 'postgres') }}
      PGHOST: localhost
      PGDATABASE: dev
      JWT_SECRET: ci-test-jwt-secret-min-16-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-16
      CLIENT_URL: http://localhost:3000
      BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: /trpc
      API_INTERNAL_URL: http://127.0.0.1:8000
      SEED_USER_EMAIL: demo@mailos.dev
      SEED_DEMO_PASSWORD: DemoPass123!
      DEMO_LOGIN_ENABLED: "true"
      DEMO_USER_EMAIL: demo@mailos.dev
      DEMO_USER_PASSWORD: DemoPass123!
      THREAD_E2E_MOCK_GMAIL: "true"
      CI: true
      CORSAIR_WEBHOOK_SECRET: ci-test-webhook-secret-min-16-chars
      GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-test-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3000/api-auth/google/callback

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Wait for Postgres readiness
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then
              echo "Postgres is ready!"
              break
            fi
            echo "Postgres not ready yet (attempt $i/30)..."
            sleep 2
          done

      - run: pnpm db:migrate

      - run: pnpm db:seed

      - run: pnpm check-types

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: API readiness gate
        run: |
          echo "Starting API and capturing logs to /tmp/api.log..."
          nohup pnpm --filter @repo/api start > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

          echo "Waiting for API server to become ready (http://127.0.0.1:8000)..."
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "API server is ready!"
              break
            fi

            if [ $((i % 6)) -eq 0 ]; then
              echo "Still waiting for API (attempt $i/90). Last 30 lines of /tmp/api.log:"
              tail -n 30 /tmp/api.log || true
            fi

            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
            echo "ERROR: API health check failed after timeout. Dumping /tmp/api.log:"
            echo "==== /tmp/api.log ===="
            cat /tmp/api.log || true
            echo "======================"
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null
          node scripts/load-test/health-smoke.mjs http://127.0.0.1:8000

      - name: E2E smoke tests
        run: |
          if ! curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
            nohup pnpm --filter @repo/api start > /tmp/api.log 2>&1 &
            for i in {1..45}; do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
          fi

          pnpm --filter web test:e2e:install
          pnpm --filter web test:e2e

      - name: Dump API logs on failure
        if: failure()
        run: |
          echo "==== /tmp/api.log ===="
          cat /tmp/api.log || true
          echo "======================"



